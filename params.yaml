training:
  faces:
    model: yolov8n.pt
    data: /kaggle/input/wider-face-a-face-detection-benchmark/data.yaml
    epochs: 100
    imgsz: 512
    batch: 4
    workers: 2
    device: 0
    cache: disk
    patience: 20
    project: training/runs/faces
    name: face_model
    save_period: 10
    plots: true
    val: true
    lr0: 0.01
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 10
    translate: 0.1
    scale: 0.5
    fliplr: 0.5
  explicit:
    model: yolov8n.pt
    data: training/explicit/data.yaml
    epochs: 120
    imgsz: 640
    batch: 8
    workers: 6
    device: 0
    cache: disk
    patience: 25
    project: training/runs/explicit
    name: explicit_model
    save_period: 10
    plots: true
    val: true
    lr0: 0.008
    lrf: 0.01
    momentum: 0.937
    weight_decay: 0.0005
    hsv_h: 0.02
    hsv_s: 0.7
    hsv_v: 0.4
    degrees: 8
    translate: 0.1
    scale: 0.5
    fliplr: 0.5

artifacts:
  faces: training/artifacts/faces
  explicit: training/artifacts/explicit
